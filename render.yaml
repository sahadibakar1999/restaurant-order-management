services:
  - type: web
    name: restaurant-order-management
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RESTAURANT_NAME
        value: "Royal Spice Bistro"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
